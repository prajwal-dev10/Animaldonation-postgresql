{% extends "layout.html" %}
{% block content %}

<div class="login-wrapper">

    <!-- LEFT: SIGNUP FORM -->
    <div class="login-box">

        <h2>Create Account</h2>

        <form method="POST" action="/signup">
            {{ form.csrf_token }}

            <label>{{ form.username.label }}</label>
            {{ form.username }}

            <label>{{ form.email.label }}</label>
            {{ form.email }}

            <label>{{ form.password.label }}</label>
            {{ form.password }}

            {{ form.submit }}
        </form>

        <a href="/login">Already have an account? Login</a>
    </div>

    <!-- RIGHT: CAT / LOTTIE -->
    <div class="login-animation">

        <dotlottie-wc
            src="https://lottie.host/f60e63de-1304-4452-acc1-66248da3ef72/xnKcdQsFdd.lottie"
            autoplay
            loop
        ></dotlottie-wc>

    </div>

</div>

{% endblock %}
